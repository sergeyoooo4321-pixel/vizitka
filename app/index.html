<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- CSP замороженный контрактом: только разрешённые домены (telegram.org, google fonts, ytimg, свой worker) -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com https://img.youtube.com; connect-src 'self' https://venchakov-api-proxy.venchakov.workers.dev; frame-src https://www.youtube.com; form-action 'self';">
  <title>venchakov — лента</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Шрифты сайта: Inter (текст) + Playfair Display (крупные заголовки) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./app.css">
<link rel="stylesheet" href="../pixel-theme.css?v=pixel20261113">
<link rel="stylesheet" href="../reference-theme.css?v=cards20261113c">
</head>
<body class="pixel-app">
  <!-- Основной контейнер контента (макс. ширина ~640px по центру) -->
  <main class="wrap">

    <!-- 1. Шапка: бейдж-логотип + подпись -->
    <header class="topbar">
      <span class="brand">venchakov</span>
      <span class="brand-sub">Материалы и разборы</span>
    </header>

    <!-- 2. Hero-баннер -->
    <section class="hero">
      <h1 class="hero-title">Лента материалов</h1>
      <p class="hero-sub">Ролики, разборы и практика по ИИ-агентам и автоматизации.</p>
      <button type="button" class="hero-btn" id="heroScroll">Все ролики</button>
    </section>

    <!-- 3. Поиск -->
    <div class="search">
      <input type="search" id="search" class="search-input" placeholder="Поиск по ленте…" autocomplete="off">
    </div>

    <!-- 4. Чипы-фильтры (строятся динамически из tag) -->
    <nav class="chips" id="chips" aria-label="Категории"></nav>

    <!-- 5. Лента карточек -->
    <section class="feed" id="feed" aria-live="polite"></section>

  </main>

  <!-- 6. Нижнее таб-меню (фикс. снизу) -->
  <nav class="tabbar" aria-label="Меню">
    <button type="button" class="tab is-active" data-tab="home">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Главная</span>
    </button>
    <button type="button" class="tab" data-tab="services" data-link="https://venchakov.com/services.html">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/></svg>
      <span>Услуги</span>
    </button>
    <button type="button" class="tab" data-tab="site" data-link="https://venchakov.com">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/></svg>
      <span>Сайт</span>
    </button>
  </nav>

  <script src="./app.js"></script>
</body>
</html>
